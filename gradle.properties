org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# ---- NeoForge / Minecraft ----
minecraft_version=1.21.1
neo_version=21.1.244

# ---- 模组信息 ----
mod_version=1.0.3
maven_group=cn.mcmod.recipedumper

# ---- 下载源镜像 ----
# BMCLAPI：Mojang 资源（client/server jar、官方库、资源文件）的镜像
bmclapi_base=https://bmclapi2.bangbang93.com
# NeoForge 官方仓库的 ForgeCDN 镜像
neoforged_mirror=https://neoforged.forgecdn.net
# 本地重写代理使用的固定端口。
# 注意：与 armor-addon-neoforge 的 47821 错开，避免两个工程同时运行时抢占端口。
mirror_port=47822
